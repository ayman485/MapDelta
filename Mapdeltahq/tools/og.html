<!doctype html>
<!-- Source for og-image.png (1200x630). Regenerate with headless Chrome:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og-image.png http://localhost:5173/tools/og.html -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  :root { color-scheme: light; --paper:#FAFAF9; --ink:#16130F; --ink-2:#6B645A; --rule:#DAD5CC; --signal:#C2410C; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  .og { display: grid; grid-template-columns: 150px 1fr; height: 630px; padding: 0 64px; }
  .og-margin { padding-top: 64px; border-right: 1px solid var(--rule); font-family: var(--mono); font-size: 18px; color: var(--ink-2); }
  .og-main { padding: 56px 0 0 40px; display: flex; flex-direction: column; }
  .og .wordmark { font-size: 30px; }
  .og h1 { margin-top: 28px; font-size: 64px; line-height: 1.05; max-width: 15em; }
  .og-plot { position: relative; margin-top: auto; margin-bottom: 52px; height: 200px; }
  .og-plot svg { width: 100%; height: 100%; overflow: visible; }
  .og-plot .map-label { top: 82px; font-size: 18px; }
  .og-plot .delta { font-size: 18px; }
  .og-tag { position: absolute; right: 0; top: -36px; font-size: 15px; }
</style></head>
<body>
<div class="og">
  <div class="og-margin">01</div>
  <div class="og-main">
    <span class="wordmark">MapDelta</span>
    <h1>Your MAP policy is only as good as the follow&#8209;through.</h1>
    <div class="og-plot">
      <span class="tag og-tag">Illustrative data</span>
      <svg viewBox="0 0 922 200" preserveAspectRatio="none">
        <line x1="0" y1="82" x2="922" y2="82" stroke="#16130F" stroke-width="1.5"/>
        <g fill="#16130F">
          <circle cx="30" cy="58" r="7"/><circle cx="110" cy="82" r="7"/><circle cx="190" cy="66" r="7"/>
          <circle cx="350" cy="42" r="7"/><circle cx="430" cy="78" r="7"/><circle cx="590" cy="70" r="7"/>
          <circle cx="670" cy="50" r="7"/><circle cx="780" cy="62" r="7"/>
        </g>
        <g fill="#C2410C">
          <circle cx="270" cy="172" r="7"/><circle cx="510" cy="124" r="7"/><circle cx="750" cy="150" r="7"/>
        </g>
      </svg>
      <span class="map-label">MAP $129.00</span>
      <span class="delta" style="left:29.3%;top:172px">−$24.05 / −18.6%</span>
      <span class="delta" style="left:55.3%;top:124px">−$11.00 / −8.5%</span>
      <span class="delta flip" style="left:81.3%;top:150px">−$16.51 / −12.8%</span>
    </div>
  </div>
</div>
</body></html>
