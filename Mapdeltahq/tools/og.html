<!doctype html>
<!-- Source for og-image.png (1200x630). Regenerate with headless Chrome:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og-image.png http://localhost:5173/tools/og.html -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #F6F4EE; }
  .og { padding: 56px 72px; height: 630px; display: grid; grid-template-columns: 1fr 380px; gap: 56px; align-items: center; }
  .og h1 { margin-top: 22px; font-size: 60px; line-height: 1.05; }
  .og .kicker { margin-top: 24px; font-size: 16px; }
  .og .report { margin: 0; }
  .og .stat { padding: 13px 18px; }
  .og .stamp { margin-left: auto; padding: 3px 9px; border: 1px solid #B8C2CE; border-radius: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body><div class="og">
  <div>
    <a class="wordmark" style="font-size:28px"><svg viewBox="0 0 20 20" style="width:26px;height:26px"><path d="M10 3.5 17.5 16.5H2.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>MapDelta</a>
    <p class="kicker">Billing Desk for freight brokers</p>
    <h1>Every delivered load, invoiced within one business day.</h1>
  </div>
  <figure class="report">
    <div class="paper-bar"><strong>Friday report</strong><span class="stamp">Sample, illustrative</span></div>
    <dl>
      <div class="stat"><dt>Delivered</dt><dd>112</dd></div>
      <div class="stat"><dt>Invoiced</dt><dd>109</dd></div>
      <div class="stat attn"><dt>Missing POD</dt><dd>3</dd></div>
      <div class="stat money"><dt>AR over 45 days</dt><dd>$18,400</dd></div>
      <div class="stat money"><dt>Carrier pay due next week</dt><dd>$61,250</dd></div>
    </dl>
  </figure>
</div></body></html>
