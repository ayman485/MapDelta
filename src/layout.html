<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0C0E">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MapDelta">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://www.mapdeltahq.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MapDelta: managed retailer deduction investigation and recovery operations.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://www.mapdeltahq.com/og-image.png">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/sans-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.classList.add('js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('motion')</script>
  <script src="/main.js" defer></script>
{{jsonld}}
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">Skip to content</a>
{{> header}}
  <main id="main">
{{content}}
  </main>
{{> footer}}
</body>
</html>
